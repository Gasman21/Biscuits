<!DOCTYPE html>
<html>
<title>Kitty Clicker</title>
<style>
    :root {
        --red: #c1121f;
        --white: #ffffff;
        --black: #000000;
    }
    #btn {
        border: 0;
        background: transparent;
        cursor: pointer;
        transition: transform 160ms ease, filter 160ms ease;
    }
    #btn:hover {
        transform: scale(1.06) rotate(-2deg);
        filter: drop-shadow(0 0 12px var(--red));
    }
    #btn:active {
        transform: scale(0.92) rotate(2deg);
    }
    .click-feedback {
        position: fixed;
        z-index: 10;
        color: var(--red);
        font: bold 24px Comic Sans MS, Comic Sans, cursive;
        text-shadow: 1px 2px 0 white;
        pointer-events: none;
        animation: float-up 700ms ease-out forwards;
    }
    @keyframes float-up {
        from { opacity: 1; transform: translate(-50%, -50%) scale(0.7) rotate(-8deg); }
        to { opacity: 0; transform: translate(-50%, -95px) scale(1.3) rotate(8deg); }
    }
    @media (prefers-reduced-motion: reduce) {
        #btn { transition: none; }
        .click-feedback { animation-duration: 1ms; }
    }
    .tabs {
        display: flex;
        justify-content: center;
        gap: 8px;
        margin: 12px 0 20px;
    }
    .tabs button {
        padding: 10px 22px;
        border: 2px solid var(--red);
        border-radius: 6px;
        background: var(--black);
        color: var(--white);
        font: bold 18px Comic Sans MS, Comic Sans, cursive;
        cursor: pointer;
    }
    .tabs button[aria-selected="true"] {
        background: var(--red);
        color: var(--white);
    }
    .shop-grid {
        display: flex;
        justify-content: center;
        align-items: stretch;
        flex-wrap: wrap;
        gap: 16px;
        padding: 0 12px 24px;
    }
    .shop-item {
        width: min(290px, 100%);
        box-sizing: border-box;
        padding: 16px;
        border: 2px solid var(--red);
        border-top: 5px solid var(--red);
        border-radius: 6px;
        background: var(--black);
        color: var(--white);
    }
    .shop-item img {
        display: block;
        width: 100%;
        height: auto;
    }
    .shop-item button {
        max-width: 100%;
        border: 0;
        background: transparent;
        cursor: pointer;
    }
</style>
<body style="background-color: var(--black); color: var(--white); text-align: center;">
    <h1 style="Font: Comic Sans MS, Comic Sans, cursive; color: var(--white);">
        Clicker

    <nav class="tabs" aria-label="Main navigation">
        <button id="game-tab" type="button" aria-selected="true" aria-controls="game-page">Game</button>
        <button id="shop-tab" type="button" aria-selected="false" aria-controls="shop-page">Shop</button>
    </nav>

        Autoclickers: <span id="upgrade-count">0</span>
    </p>
    <p style="Font: Comic Sans MS, Comic Sans, cursive; color: var(--white); font-size : 20px;">
        Auto-clicks per second: <span id="cps-display">0</span>
    </p>
    </section>
    <section id="shop-page" hidden>
        <h2 style="Font: Comic Sans MS, Comic Sans, cursive; color: var(--white);">Shop</h2>
        <div class="shop-grid">
            <article class="shop-item">
                <h3 style="Font: Comic Sans MS, Comic Sans, cursive; color: var(--white);">Autoclicker</h3>
                <button id="upgrade" type="button" aria-label="Buy autoclicker">
                    <img src="https://www.lovemeow.com/media-library/image.jpg?id=4142900&width=800&quality=85" alt="Autoclicker upgrade">
                </button>
                <p style="Font: Comic Sans MS, Comic Sans, cursive; color: var(--white); font-size: 20px;">
                    Cost: $<span id="upgrade-display">10</span>
                </p>
            </article>
            <article class="shop-item">
                <h3 style="Font: Comic Sans MS, Comic Sans, cursive; color: var(--white);">Click Power</h3>
                <button id="click-upgrade" type="button" aria-label="Upgrade click power">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRpz9Fkg5yMdzt7CiZVs2Y6lIpc3MNfvD8EtErvhVwjcQ&s=10" alt="Click power upgrade">
                </button>
                <p style="Font: Comic Sans MS, Comic Sans, cursive; color: var(--white); font-size: 20px;">
                    Cost: $<span id="click-upgrade-display">25</span>
                    | Power: x<span id="click-power-display">1</span>
                </p>
            </article>
        </div>
    </section>
    </main>
    <script type="text/javascript">
        let click_count = 0;
        let upgrade_cost = 10;
        let upgrade_count = 0;
        let click_power = 1;
        let click_upgrade_cost = 25;
        let btn = document.getElementById("btn");
        let disp = document.getElementById("display");
        let upgradeDisp = document.getElementById("upgrade-display");
        let upgradeCountDisp = document.getElementById("upgrade-count");
        let cpsDisp = document.getElementById("cps-display");
        let clickUpgradeDisp = document.getElementById("click-upgrade-display");
        let clickPowerDisp = document.getElementById("click-power-display");
        let gamePage = document.getElementById("game-page");
        let shopPage = document.getElementById("shop-page");
        let gameTab = document.getElementById("game-tab");
        let shopTab = document.getElementById("shop-tab");

        gameTab.addEventListener("click", function () {
            gamePage.hidden = false;
            shopPage.hidden = true;
            gameTab.setAttribute("aria-selected", "true");
            shopTab.setAttribute("aria-selected", "false");
        });

        shopTab.addEventListener("click", function () {
            gamePage.hidden = true;
            shopPage.hidden = false;
            gameTab.setAttribute("aria-selected", "false");
            shopTab.setAttribute("aria-selected", "true");
        });

        function showClickEffect(amount, x, y) {
            if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
                btn.animate([
                { transform: "scale(1) rotate(0deg)" },
                { transform: "scale(0.9) rotate(-5deg)" },
                { transform: "scale(1.08) rotate(4deg)" },
                { transform: "scale(1) rotate(0deg)" }
                ], { duration: 360, easing: "ease-out" });
            }

            let feedback = document.createElement("span");
            feedback.className = "click-feedback";
            feedback.textContent = "+" + amount;
            feedback.style.left = x + "px";
            feedback.style.top = y + "px";
            document.body.appendChild(feedback);
            setTimeout(function () { feedback.remove(); }, 700);
        }

        btn.addEventListener("click", function (event) {
            click_count += click_power;
            disp.innerHTML = click_count;
            showClickEffect(click_power, event.clientX, event.clientY);
        });

        setInterval(function () {
            if (upgrade_count > 0) {
                let autoClicks = upgrade_count;
                click_count += autoClicks;
                disp.innerHTML = click_count;
                let kittyBounds = btn.getBoundingClientRect();
                showClickEffect(
                    autoClicks,
                    kittyBounds.left + kittyBounds.width / 2,
                    kittyBounds.top + kittyBounds.height / 2
                );
            }
        }, 1000);
        
        document.getElementById("upgrade").addEventListener("click", function () {
            if (click_count >= upgrade_cost) {
                click_count -= upgrade_cost;
                upgrade_count++;
                upgrade_cost = Math.floor(upgrade_cost * 1.5);
                disp.innerHTML = click_count;
                upgradeDisp.innerHTML = upgrade_cost;
                upgradeCountDisp.innerHTML = upgrade_count;
                cpsDisp.innerHTML = upgrade_count;
            }
        });

        document.getElementById("click-upgrade").addEventListener("click", function () {
            if (click_count >= click_upgrade_cost) {
                click_count -= click_upgrade_cost;
                click_power *= 2;
                click_upgrade_cost = Math.floor(click_upgrade_cost * 1.8);
                disp.innerHTML = click_count;
                clickUpgradeDisp.innerHTML = click_upgrade_cost;
                clickPowerDisp.innerHTML = click_power;
            }
        });

    </script>
</body>
